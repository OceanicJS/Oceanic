name: Publish To pkg.pr.new
permissions:
    contents: read
on:
    push:
        branches: [dev]
    pull_request:
    release:
        types: [released]

jobs:
    lint:
        name: ESLint
        uses: ./.github/workflows/lint.yml
    publish:
        if: github.event.repository.fork == false
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v6
            - uses: fregante/setup-git-user@v2
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm i --frozen-lockfile --ignore-scripts --force
            - run: |
                  pnpm version --no-git-tag-version patch
                  hash=$(git rev-parse --short HEAD)
                  version=$(jq -r .version package.json)
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    v="$version-pr.${{ github.event.pull_request.number }}.$hash"
                  else
                    v="$version-dev.$hash"
                  fi
                  echo "Setting Version: $v"
                  contents=$(jq --arg version "$v" '.version = $version' package.json) && echo -E "${contents}" > package.json
            - run: pnpx pkg-pr-new publish --packageManager="pnpm" --pnpm
